[package]
name = "angel"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Household readability web proxy"
publish = false

[dependencies]
ammonia = "4"
chardetng = "1"
cookie_store = { version = "0.22", default-features = false, features = ["preserve_order", "serde_json"] }
dom_query = "0.29"
dom_smoothie = "0.19"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
lexopt = "0.3"
percent-encoding = "2"
psl = "2"
serde_json = "1"
tiny_http = "0.12"
toml = "0.9"
ureq = { version = "3", features = ["brotli"] }
url = "2"

[profile.release]
debug = 1
