# optional: "?" drops a path whose ${NAME} is unset or empty
+rwx ?${SB_DESTDIR}

# one kept, two dropped (unset, empty), one plain
+r ?${SB_PROJ}/build ?${SB_UNSET}/a ?${SB_EMPTY}/b .exrc

# quoted, literal, and regex forms
+r ?"${SB_UNSET}/with space" ?=${SB_UNSET}/lit ?r"^${SB_UNSET}/.*"
+r ?"${SB_PROJ} dir" ?=${SB_PROJ}.lit ?r"^/${SB_PROJ}/.*"

# a "?" path with no variables (or only built-in ones) is always kept
+r ?.vimrc ?${CWD}/sub

# two variables in one path, one of them unset
+r ?${SB_PROJ}/${SB_UNSET}

# denies, too
-w ?${SB_UNSET}/logs

# @rewrite with an optional side is dropped as a whole
@rewrite ?${SB_UNSET}/ /nowhere/
@rewrite ?${SB_PROJ}/ /somewhere/
